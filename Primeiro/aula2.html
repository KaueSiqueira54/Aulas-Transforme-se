<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 02 - CSS</title>

    <!-- Usando estilos dentro do HTML -->
    <style>
      body {
        /* Cor de fundo */
        background-color: rgb(0, 64, 183);
      }

      h1 {
        /* Color - cor de texto */
        text-align: center;
        color: #fff;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <h1 style="color: rgb(0, 5, 30); background-color: #fff">
      Trabalhando com CSS
    </h1>
    <h1>Segundo texto</h1>
    <h1>Terceiro texto</h1>

    <p style="color: #fff; background-color: #000">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam, nostrum
      dolorum quaerat laudantium quasi voluptate libero, qui numquam error
      voluptates et alias quibusdam at id sequi? Eius et nostrum modi.
    </p>
  </body>
</html>

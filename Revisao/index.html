<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisão</title>

    <link rel="stylesheet" href="src/styles/revisao.css" />
  </head>
  <body>
    <h1>Lista de Compras</h1>

    <!-- ul - lista não ordenada -->
    <!-- ol - lista ordenada -->

    <!-- Crie uma lista com 5 produtos - UL -->
    <ul>
      <li>Agua</li>
      <li>arroz</li>
      <li>Batata</li>
      <li>Alho</li>
      <li>Cebola</li>
      <li>Macarrão</li>
    </ul>

    <!-- Crie uma OL numérica começando do 5 -->
    <ol start="5" type="I">
      <li>Cachorro</li>
      <li>Gato</li>
      <li>Canário</li>
      <li>Bem-te-vi</li>
      <li>Calopsita</li>
    </ol>
  </body>
</html>
